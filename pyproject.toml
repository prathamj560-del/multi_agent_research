[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "researchmind"
version = "1.0.0"
description = "Multi-agent AI research system: LangGraph state machine, Groq LPU inference, structured outputs, self-correcting critique loop."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "prathamj560-del" }]
keywords = ["ai-agents", "langgraph", "groq", "streamlit", "llm", "research"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-groq>=1.0,<2",
    "langgraph>=1.0,<2",
    "groq>=0.9",
    "streamlit>=1.36",
    "tavily-python>=0.5,<1",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5.0",
    "httpx>=0.27",
    "cachetools>=5.3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
researchmind = "researchmind.cli:main"
researchmind-evals = "researchmind.evals:main_cli"

[tool.hatch.build.targets.wheel]
packages = ["src/researchmind"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# app.py embeds a CSS design-system blob that cannot be reasonably wrapped.
"app.py" = ["E501"]

[tool.mypy]
files = ["src"]
python_version = "3.12"
mypy_path = "src"
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tavily.*", "streamlit.*", "langchain_groq.*", "langchain.*", "langgraph.*", "bs4.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
